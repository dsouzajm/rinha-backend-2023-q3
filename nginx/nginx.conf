events {
    # Optional: configure worker connections, e.g., worker_connections 1024;
}

http {
    # Define o grupo de servidores backend (as aplicações Java)
    # Este bloco DEVE estar dentro do contexto http {}
    upstream java_apps {
        server app1:80;
        server app2:80;
    }

    server {
        listen 9999;
        server_name localhost;

        location / {
            # Redireciona as requisições para o grupo de servidores upstream
            proxy_pass http://java_apps;

            # Cabeçalhos importantes para o correto funcionamento do proxy reverso
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}