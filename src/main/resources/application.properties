server.port=80
spring.threads.virtual.enabled=true

# Desligando logs para maxima performance (apenas erros criticos)
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.br.com.dsouzajm=ERROR
# Desabilita log de startup do Spring
spring.main.log-startup-info=false
# Desabilita banner
spring.main.banner-mode=off

spring.datasource.url=jdbc:postgresql://pessoa-db:5432/pessoa_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=45
spring.datasource.hikari.minimum-idle=45
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000