version: '3.8'

services:

  # PostgreSQL Database Service
  pessoa-db:
    image: postgres:17-alpine
    container_name: pessoa_db
    # Tuning agressivo para performance de escrita:
    # - synchronous_commit=off: Não espera o disco confirmar (risco de perda mínima em crash, mas muito mais rápido)
    # - log_min_messages=panic: Desabilita logs para economizar I/O
    command: postgres -c 'synchronous_commit=off' -c 'log_min_messages=panic' -c 'log_min_error_statement=panic'
    environment:
      POSTGRES_DB: pessoa_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/script.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pessoa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.01'
          memory: '900MB'

  # Redis Cache Service
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: '400MB'

  # Java Application Service 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    expose:
      - "80"
    depends_on:
      pessoa-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pessoa-db:5432/pessoa_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '600MB'

  # Java Application Service 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    expose:
      - "80"
    depends_on:
      pessoa-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pessoa-db:5432/pessoa_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '600MB'

  # Nginx Reverse Proxy Service
  nginx:
    build:
      context: ./nginx
    restart: always
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: '0.08'
          memory: '500MB'

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge